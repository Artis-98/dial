name: Build

# Pull requests: build every dial-*.yaml to prove it compiles.
# Tag v*: build, attach the files to a GitHub release, and publish them to
# GitHub Pages, where DIALs and Home Assistant look for updates.

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.find.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          builds=$(ls dial-*.yaml | grep -v -e '^dial-core.yaml$' -e '^dial-home.yaml$' | jq -R . | jq -sc .)
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.list.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - name: Profile name
        id: p
        run: |
          f="${{ matrix.file }}"; p="${f#dial-}"; echo "profile=${p%.yaml}" >> "$GITHUB_OUTPUT"
      - uses: esphome/build-action@v8.1.0
        id: esphome
        with:
          yaml-file: ${{ matrix.file }}
          version: 2026.10.1
          complete-manifest: true
          release-summary: ${{ startsWith(github.ref, 'refs/tags/') && format('DIAL {0}', github.ref_name) || '' }}
          release-url: ${{ startsWith(github.ref, 'refs/tags/') && format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || '' }}
      - name: Collect
        run: |
          p=${{ steps.p.outputs.profile }}
          mkdir -p out/$p
          cp ${{ steps.esphome.outputs.name }}/* out/$p/
          cd out/$p
          for f in *.bin; do mv "$f" "dial-$p.${f#*.}"; done
          jq --arg p "$p" '.builds |= map(if .ota then .ota.path = "dial-\($p).ota.bin" else . end | if .parts then .parts |= map(.path = "dial-\($p).factory.bin") else . end)' manifest.json > m && mv m manifest.json
          rm -f *.elf
          ls -la; cat manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ steps.p.outputs.profile }}
          path: out

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: firmware
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "DIAL ${{ github.ref_name }}" --generate-notes firmware/*/*.bin

  pages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: site/firmware
      - run: cp -r static/* site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
