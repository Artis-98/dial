# DIAL core: the board, Wi-Fi, Home Assistant API, DIAL's own page, LED,
# buttons, history, OLED and firmware updates. Everything inverter specific
# lives in profiles/; a build file (dial-growatt-spf.yaml) puts the two
# together. Contributors add profiles and leave this file alone.
#
# Every unit is named dial-<last 6 of its MAC> and has no API key of its own
# until Home Assistant adds it and gives it one (saved on the device).
# Holding BOOT for 10 s wipes that key and the Wi-Fi.
#
# Open http://dial-1a2b3c.local for DIAL's own page (web/dial-ui.js). If DIAL
# cannot join Wi-Fi it opens the hotspot "DIAL-Setup" (password dialsetup)
# with the setup page in components/captive_portal.
#
# A profile must provide these ids, which the page, the history, the OLED
# and the LED use: sensors battery_soc, battery_voltage, pv_power,
# load_power, grid_voltage; text_sensor battery_state; binary_sensor
# inv_connected. And the substitution `profile` comes from the build file.

substitutions:
  dial_version: "2.2.0"
  update_url: https://artis-98.github.io/dial/firmware/${profile}/manifest.json

esphome:
  name: dial
  friendly_name: DIAL
  comment: "DIAL inverter controller by IITEG"
  name_add_mac_suffix: true
  project:
    name: iiteg.dial
    version: "${dial_version}"
  # the alert list, the write check and their texts (dial-pcb/docs/ALERTS.md)
  includes:
    - dial_alerts.h
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: status_led
          effect: Breathe
      - lambda: |-
          dial::alert_set(dial::STARTING, true);
          const esp_reset_reason_t r = esp_reset_reason();
          // shown for the first hour after such a restart
          if (r == ESP_RST_BROWNOUT) dial::alert_pulse(dial::BROWNOUT, 3600000);
          if (r == ESP_RST_PANIC || r == ESP_RST_INT_WDT || r == ESP_RST_TASK_WDT || r == ESP_RST_WDT)
            dial::alert_pulse(dial::CRASHED, 3600000);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  # captive_portal: ESPHome's own with DIAL's setup page (web/setup.html)
  # dial_history: the last 24 h in RAM for the page's charts (/history.json)
  - source:
      type: local
      path: components
    components: [captive_portal, dial_history]

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG
  logs:
    sensor: INFO
    text_sensor: INFO
    number: INFO
    select: INFO
    light: INFO
    component: INFO
    scheduler: INFO

wifi:
  reboot_timeout: 0s
  ap:
    ssid: "DIAL-Setup"
    password: "dialsetup"

captive_portal:

web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "web/dial-ui.js"
  log: true

# one point a minute for a day, recorded whether or not the page is open
dial_history:
  update_interval: 5s
  points: 1440
  point_every: 60s
  series:
    - {key: soc, sensor: battery_soc}
    - {key: pv, sensor: pv_power}
    - {key: load, sensor: load_power}
    - {key: bv, sensor: battery_voltage, scale: 100}
    - {key: grid, sensor: grid_voltage}

ota:
  - platform: esphome
    on_begin: {then: [lambda: "dial::alert_set(dial::UPDATING, true);"]}
    on_error: {then: [lambda: "dial::alert_set(dial::UPDATING, false);"]}
  - platform: web_server
    on_begin: {then: [lambda: "dial::alert_set(dial::UPDATING, true);"]}
    on_error: {then: [lambda: "dial::alert_set(dial::UPDATING, false);"]}
  - platform: http_request
    on_begin: {then: [lambda: "dial::alert_set(dial::UPDATING, true);"]}
    on_error: {then: [lambda: "dial::alert_set(dial::UPDATING, false);"]}

api:
  reboot_timeout: 0s
  # No key: Home Assistant sets a random one when it adds the unit, and
  # from then on the unit only talks encrypted with that key.
  encryption: {}

# firmware updates from GitHub: Home Assistant and DIAL's page show when a
# newer release of this profile exists and install it with one press
http_request:
  timeout: 20s

update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    source: ${update_url}
    update_interval: 6h

switch:
  - platform: gpio
    id: relay
    name: "Dry Contact"
    pin: GPIO21
    restore_mode: ALWAYS_OFF
    icon: "mdi:electric-switch"

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  # wipes the API key and Wi-Fi; pressed by holding BOOT for 10 s
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

sensor:
  # DIAL board
  - platform: adc
    id: variant_v
    name: "Variant ID Voltage"
    pin: GPIO1
    attenuation: 12db
    update_interval: 60s
    accuracy_decimals: 2
    entity_category: diagnostic
  - platform: internal_temperature
    id: chip_temp
    name: "Chip Temperature"
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi Signal"
    update_interval: 30s
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: "Inverter Link"
    icon: "mdi:swap-horizontal"
    update_interval: 5s
    lambda: |-
      return {id(inv_connected).state ? "Connected" : "No answer"};
  - platform: template
    id: board_variant
    name: "Board Variant"
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      float v = id(variant_v).state;
      if (isnan(v)) return {"unknown"};
      if (v > 2.9f) return {"Model S"};
      if (v > 2.0f) return {"Model S + CAN"};
      if (v > 1.35f) return {"Model D"};
      if (v > 0.8f) return {"Model D + CAN"};
      return {"unknown"};
  - platform: template
    name: "Firmware"
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"DIAL " ESPHOME_PROJECT_VERSION ", ESPHome " ESPHOME_VERSION};
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
  # alerts: published by the alert interval below, only when they change
  - platform: template
    id: alert_code
    name: "Alert"
    icon: "mdi:alert-circle-outline"
  - platform: template
    id: alert_text
    name: "Alert Message"
    icon: "mdi:message-alert-outline"
  - platform: template
    id: alert_all
    name: "Alerts Active"
    icon: "mdi:format-list-bulleted"
    entity_category: diagnostic
  - platform: template
    id: write_last_ts
    name: "Last Setting Write"
    icon: "mdi:pencil-check"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Home Assistant Connected"
    device_class: connectivity
    entity_category: diagnostic
    lambda: return api::global_api_server != nullptr && api::global_api_server->is_connected();
  # on while any critical or warning alert is active
  - platform: template
    id: dial_problem
    name: "Problem"
    device_class: problem
  - platform: gpio
    id: boot_button
    name: "BOOT Button"
    entity_category: diagnostic
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    # held 10 s: the LED goes solid, and letting go resets DIAL
    on_press:
      - delay: 10s
      - if:
          condition:
            binary_sensor.is_on: boot_button
          then:
            - lambda: "dial::alert_set(dial::RESET_HOLD, true);"
            - light.turn_on:
                id: status_led
                brightness: 100%
                effect: none
    on_release:
      - lambda: "dial::alert_set(dial::RESET_HOLD, false);"
    on_click:
      min_length: 10s
      max_length: 60s
      then:
        - button.press: factory_reset_btn

output:
  - platform: ledc
    id: led_out
    pin: GPIO2

light:
  - platform: monochromatic
    id: status_led
    name: "Status LED"
    output: led_out
    entity_category: config
    effects:
      # talking to the inverter
      - pulse:
          name: Breathe
          transition_length: 1500ms
          update_interval: 1500ms
      # no answer yet: still breathing, just quicker
      - pulse:
          name: Searching
          transition_length: 400ms
          update_interval: 400ms

# ------------------------------------------------------------------ alerts
# The list and texts are in dial_alerts.h. This collects the conditions the
# core can see, publishes the Alert entities when they change, and sets the
# LED: quick breath for a critical alert, normal breath otherwise (no
# blinking, by choice). Profiles add their own (inverter_hot, write checks).
number:
  - platform: template
    id: low_batt_level
    name: "Low Battery Alert"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:battery-alert-variant-outline"
    entity_category: config

globals:
  - id: ha_seen
    type: bool
    initial_value: "false"
  - id: ha_gone_s
    type: int
    initial_value: "0"
  - id: alert_shown
    type: std::string
    initial_value: '""'

interval:
  - interval: 2s
    then:
      - lambda: |-
          using namespace dial;
          const uint32_t up = millis() / 1000;
          const bool inv = id(inv_connected).state;

          alert_set(STARTING, !inv && up <= 30);
          alert_set(NO_INVERTER, !inv && up > 30);

          const float soc = id(battery_soc).state, bv = id(battery_voltage).state;
          alert_set(LOW_BATTERY, inv && !std::isnan(soc) && soc < id(low_batt_level).state);
          alert_set(WRONG_PROFILE, inv && ((!std::isnan(soc) && (soc < 0 || soc > 100)) ||
                                           (!std::isnan(bv) && (bv < 5 || bv > 100))));
          const float gv = id(grid_voltage).state;
          alert_set(GRID_DOWN, inv && !std::isnan(gv) && gv < 100);

          const bool ha = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (ha) { id(ha_seen) = true; id(ha_gone_s) = 0; }
          else if (id(ha_seen)) id(ha_gone_s) += 2;
          alert_set(HA_LOST, id(ha_seen) && id(ha_gone_s) > 120);

          const float ct = id(chip_temp).state, rssi = id(wifi_rssi).state;
          alert_set(CHIP_HOT, !std::isnan(ct) && ct > 85);
          alert_set(WEAK_WIFI, !std::isnan(rssi) && rssi < -82);
          alert_set(HW_UNKNOWN, up > 150 && id(board_variant).state == "unknown");
          alert_set(DRY_CONTACT, id(relay).state);

          write_tick();
          alert_tick();

          const int top = alert_top();
          const std::string code = top < 0 ? "ok" : ALERTS[top].code;
          const std::string all = alert_list();
          if (id(alert_code).state != code) {
            id(alert_code).publish_state(code);
            id(alert_text).publish_state(top < 0 ? "All good" : ALERTS[top].text);
          }
          if (id(alert_all).state != all) id(alert_all).publish_state(all);
          if (id(write_last_ts).state != write_last) id(write_last_ts).publish_state(write_last);
          const int worst = alert_worst();
          const bool problem = worst >= WARNING;
          if (!id(dial_problem).has_state() || id(dial_problem).state != problem) id(dial_problem).publish_state(problem);

          if (alert_on[RESET_HOLD]) return;  // the LED is solid while BOOT is held
          const std::string fx = worst == CRITICAL ? "Searching" : "Breathe";
          if (id(alert_shown) != fx) {
            id(alert_shown) = fx;
            auto call = id(status_led).turn_on();
            call.set_effect(fx);
            call.perform();
          }

# ------------------------------------------------------------------ OLED, if fitted (Model D)
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: false

font:
  - file: "gfonts://Roboto"
    id: f_small
    size: 11
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 18

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      it.print(64, 0, id(f_small), TextAlign::TOP_CENTER, id(inv_connected).state ? "DIAL" : "DIAL  no inverter");
      it.printf(64, 14, id(f_big), TextAlign::TOP_CENTER, "%s", id(battery_state).state.c_str());
      if (!isnan(id(battery_soc).state)) it.printf(0, 38, id(f_small), "SOC %.0f%%", id(battery_soc).state);
      if (!isnan(id(battery_voltage).state)) it.printf(127, 38, id(f_small), TextAlign::TOP_RIGHT, "%.1f V", id(battery_voltage).state);
      if (!isnan(id(pv_power).state)) it.printf(0, 52, id(f_small), "PV %.0f W", id(pv_power).state);
      if (!isnan(id(load_power).state)) it.printf(127, 52, id(f_small), TextAlign::TOP_RIGHT, "Load %.0f W", id(load_power).state);
